demos:
  wright_s_cross_dual_disequilibrium_model:
    name: Wright's Cross-Dual Disequilibrium Model
    desc: Starting parameters are based on the example in Wright's PhD thesis. See
      the GitHub wiki pages for detailed information.
    details:
      plot_preprocess: format_plot_config
      simulation_model: wright-cross-dual
      simulation_function: simulate
      default_preset: default_preset
      simulation_speed: '0.01'
      axis_settings:
        dimension: [1, 1]
        limits:
          a1: [[0.0, 100.0], [0.0, 15.0]]
        dropdown_indices: [0]
        checked_plots:
          a1: [Unit Prices, Unit Values]
        settings:
          a1:
            legend_visible: true
            legend_fontsize: 10
            legend_loc: upper right
            title: true
            xlabel: true
            ylabel: true
    default: true
  boltzmann_wealth_distribution_agent_based_model:
    name: Boltzmann Wealth Distribution Agent-Based Model
    desc: TBA
    details:
      simulation_model: boltzmann-wealth-distribution
      simulation_function: get_trajectories
      default_preset: default_preset
      starting_lims: [[0.0, 10.0], [0.0, 100.0]]
      simulation_speed: 0.044
      axis_settings:
        dimension: [1, 2]
        limits:
          a1: [[-0.458536, 7.33996], [0.0839456, 78.0963]]
          a2: [[1.30881, 328.206], [-0.00651863, 0.961886]]
        dropdown_indices: [0, 1]
        checked_plots:
          a1: [Wealth Distribution]
          a2: [Gini Coefficient, Total Money in Circulation]
        settings:
          a1:
            legend_visible: true
            legend_fontsize: 10
            legend_loc: upper right
            title: true
            xlabel: true
            ylabel: true
          a2:
            legend_visible: true
            legend_fontsize: 8
            legend_loc: upper right
            title: true
            xlabel: true
            ylabel: true
