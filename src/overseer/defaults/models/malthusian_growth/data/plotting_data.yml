population:
  name: Population
  tooltip: null
  plots:
    population:
      checkbox_name: Population
      toggled: true
      linestyle: solid
      linewidth: 1.5
      markersize: 6.0
      labels: [Peasant Population]
      colors: [red]
      traj_key: population
    surplus:
      checkbox_name: Surplus
      toggled: true
      linestyle: solid
      linewidth: 1.5
      markersize: 6.0
      labels: [Post-Harvest Surplus]
      colors: [blue]
      traj_key: post_harvest_surplus
    population_continuous:
      checkbox_name: Population (Continuous)
      toggled: true
      linestyle: dashed
      linewidth: 1.5
      markersize: 6.0
      labels: [Population (Cts Version)]
      colors: [red]
      traj_key: population_cts
      traj_key_x: t_cts
    elite_population:
      checkbox_name: Elite Population
      toggled: false
      linestyle: solid
      linewidth: 1.5
      markersize: 6.0
      labels: [Elite Population]
      colors: [green]
      traj_key: elite_population
    elite_surplus:
      checkbox_name: Elite Surplus
      toggled: true
      linestyle: solid
      linewidth: 1.5
      markersize: 6.0
      labels: [Post-Harvest Elite Surplus]
      colors: ['#2aedff']
      traj_key: post_harvest_surplus_elites
  projection: 2d
  axis_visible: true
  grid_visible: true
  ticks_visible: true
  frame_visible: true
