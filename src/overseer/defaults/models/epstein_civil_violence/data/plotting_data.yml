all:
  name: All
  axis_visible: false
  grid_visible: false
  ticks_visible: false
  frame_visible: false
  plots:
    grid:
      special: heatmap
      checkbox_name: Grid
      toggled: true
      traj_key: u
      discrete: true
      colorbar: false
      colorbar_labels: false
      aspect: equal
      interpolation: nearest
      origin: lower
      values: cell_values
      colors: cell_colors
      marker_values: u
      overlay_markers:
        codes: ['1', '2', '3', '4']
        sizes: [100, 100, 100, 100]
        labels: [Cop, Citizen (Quiet), Citizen (Active), Citizen (Jailed)]
        markers: [^, o, o, o]
        colors: ['#54C4C4', '#9BD08A', '#D73229', '#565656']
        edgecolors: ['#54C4C4', '#9BD08A', '#D73229', '#565656']
  default_lims: [[0.0, 40.0], [0.0, 40.0]]
demographics:
  name: Demographics
  projection: 2d
  axis_visible: false
  grid_visible: false
  ticks_visible: false
  frame_visible: false
  plots:
    citizen_states:
      special: pie
      checkbox_name: Citizen States
      toggled: true
      traj_key: states
      color_map: pie_color_map
      label_map: pie_label_map
  default_lims: [[-1.0, 1.0], [-1.0, 1.0]]
